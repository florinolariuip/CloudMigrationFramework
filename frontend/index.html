<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloud Migration Optimizer</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    // Minimal SVG icons (inline) for no-build setup
    const Icon = ({ path, viewBox = '0 0 24 24', className = '' }) => (
      <svg className={className} width="24" height="24" viewBox={viewBox} fill="none" stroke="currentColor" strokeWidth="2">
        {path}
      </svg>
    );

    const Cloud = (props) => <Icon {...props} path={<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>} />;
    const Database = (props) => <Icon {...props} path={<><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4.03 3 9 3s9-1.34 9-3"/></>} />;
    const Server = (props) => <Icon {...props} path={<><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></>} />;
    const Shield = (props) => <Icon {...props} path={<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/>} />;
    const Zap = (props) => <Icon {...props} path={<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>} />;
    const TrendingUp = (props) => <Icon {...props} path={<><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></>} />;
    const CheckCircle = (props) => <Icon {...props} path={<><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></>} />;
    const Settings = (props) => <Icon {...props} path={<><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></>} />;
    const Play = (props) => <Icon {...props} path={<polygon points="5 3 19 12 5 21 5 3"/>} />;
    const Download = (props) => <Icon {...props} path={<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></>} />;
    const Activity = (props) => <Icon {...props} path={<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>} />;

    // Sankey Diagram Component
    const SankeyDiagram = ({ data, title, containerId }) => {
      useEffect(() => {
        if (!data || !data.nodes || !data.links) return;
        
        const plotData = [{
          type: "sankey",
          node: {
            pad: 15,
            thickness: 20,
            line: { color: "white", width: 0.5 },
            label: data.nodes.map(n => n.name),
            color: data.nodes.map(n => n.color)
          },
          link: {
            source: data.links.map(l => l.source),
            target: data.links.map(l => l.target),
            value: data.links.map(l => l.value),
            color: data.links.map(l => l.color || 'rgba(0,0,0,0.2)'),
            label: data.links.map(l => l.label || '')
          }
        }];
        
        const layout = {
          title: {
            text: title,
            font: { color: 'white', size: 18 }
          },
          font: { size: 12, color: 'white' },
          paper_bgcolor: 'rgba(0,0,0,0)',
          plot_bgcolor: 'rgba(0,0,0,0)',
          margin: { l: 20, r: 20, t: 60, b: 20 }
        };
        
        const config = {
          displayModeBar: true,
          displaylogo: false,
          modeBarButtonsToRemove: ['pan2d', 'lasso2d', 'select2d']
        };
        
        Plotly.newPlot(containerId, plotData, layout, config);
      }, [data, title, containerId]);
      
  return <div id={containerId} style={{ width: '100%', height: '300px', minHeight: '200px', maxHeight: '500px' }} />;
    };

    function ComponentMultiSelect({ constraints, setConstraints, serviceData }) {
      // Get all available components from serviceData (or fallback to static list)
      var allComponents = serviceData && serviceData.services && serviceData.services.options ? Object.keys(serviceData.services.options) : [
        "api_gateway", "identity_management", "analytics", "database", "nosql_database", "application_server", "storage",
        "cache", "message_queue", "event_streaming", "cdn", "load_balancer", "monitoring", "backup", "encryption", "containers", "serverless_compute", "iot_platform"
      ];
      // Default to all selected if not set
      var selected = constraints.selected_components || allComponents;

      function toggleComponent(comp) {
        var newSelected;
        if (selected.includes(comp)) {
          newSelected = selected.filter(function(c) { return c !== comp; });
        } else {
          newSelected = selected.concat([comp]);
        }
        // Always keep at least one selected
        if (newSelected.length === 0) return;
        setConstraints(Object.assign({}, constraints, { selected_components: newSelected }));
      }

      return (
        <div className="bg-white/5 rounded-lg p-2 border border-blue-500/20 max-h-40 overflow-y-auto">
          <div className="flex flex-wrap gap-2">
            {allComponents.map(function(comp) {
              return (
                <button
                  key={comp}
                  type="button"
                  className={"px-2 py-1 rounded text-xs font-semibold transition border " + (selected.includes(comp) ? 'bg-blue-600 text-white border-blue-600' : 'bg-white/10 text-blue-200 border-blue-500/20 hover:bg-blue-500/20')}
                  onClick={function() { toggleComponent(comp); }}
                  title={comp.replace(/_/g, ' ')}
                >
                  {comp.replace(/_/g, ' ')}
                </button>
              );
            })}
          </div>
          <div className="mt-2 text-xs text-blue-300">{selected.length} selected</div>
        </div>
      );
    }

    function CloudMigrationOptimizer() {
  const [constraints, setConstraints] = useState({ maxBudget: 10000, maxLatency: 150, maxProviders: 3 });
    // Workload Profile state
    const [requestsPerMonth, setRequestsPerMonth] = useState(10000000);
    const [crossAzGb, setCrossAzGb] = useState(500);
    const [internetEgressGb, setInternetEgressGb] = useState(1000);
    const [ebsGb, setEbsGb] = useState(100);
    const [rdsBackupGb, setRdsBackupGb] = useState(150);
    const [s3Gb, setS3Gb] = useState(500);
        // Helper to suggest minimum budget and provider count for feasible solutions
        function getSuggestion() {
          if (!serviceData || !serviceData.services || !serviceData.services.costs) return null;
          const costs = Object.values(serviceData.services.costs).map(Number).filter(x => !isNaN(x));
          const minCost = Math.min(...costs);
          const availableProviders = serviceData.services.options ? Object.keys(serviceData.services.options) : [];
          const minProviders = 1;
          let suggestion = [];
          if (constraints.maxBudget < minCost) {
            suggestion.push(`Increase budget to at least $${minCost} (currently $${constraints.maxBudget})`);
          }
          if (constraints.maxProviders < availableProviders.length && availableProviders.length > 1) {
            suggestion.push(`Increase allowed providers to up to ${availableProviders.length} (currently ${constraints.maxProviders})`);
          }
          // Check latency constraint
          if (serviceData.services.latency) {
            const latencies = Object.values(serviceData.services.latency).map(Number).filter(x => !isNaN(x));
            const minLatency = Math.min(...latencies);
            if (constraints.maxLatency < minLatency) {
              suggestion.push(`Increase max latency to at least ${minLatency}ms`);
            }
          }
          // Add other constraints if needed (extend here)
          return suggestion.length ? suggestion.join(' and ') : null;
        }
      const [preferences, setPreferences] = useState({ preferredProvider: '', prioritizeCost: false, prioritizePerformance: false });
      const [results, setResults] = useState(null);
      const [baselineComparison, setBaselineComparison] = useState(null);
      const [loading, setLoading] = useState(false);
      const [loadingBaselines, setLoadingBaselines] = useState(false);
      const [activeTab, setActiveTab] = useState('configuration');
      const [serviceData, setServiceData] = useState(null);
  const [showDocsMenu, setShowDocsMenu] = useState(false);
  const [showServiceBanner, setShowServiceBanner] = useState(true);
  // Track if docs dropdown is open by click
  const [docsMenuClicked, setDocsMenuClicked] = useState(false);
      const [loadingServices, setLoadingServices] = useState(true);
      const [serviceError, setServiceError] = useState(null);
      const [academicConfig, setAcademicConfig] = useState(null);

  // Dynamic API base resolution:
  // 1. Explicit window.API_BASE override (set via console or injected script)
  // 2. localStorage key 'API_BASE'
  // 3. If running on localhost, try local backend first then fallback to Heroku
  // 4. Default to Heroku deployment URL
  const resolveApiBase = () => {
    const heroku = 'https://migration-framework-c77589bc07d3.herokuapp.com';
    const explicit = window.API_BASE || localStorage.getItem('API_BASE');
    if (explicit) return explicit.replace(/\/$/, '');
    const isLocal = ['localhost','127.0.0.1'].includes(window.location.hostname);
    if (!isLocal) return heroku;
    // For local dev attempt health probe synchronously-ish (with timeout) using navigator.sendBeacon fallback
    // We'll optimistically return local first; frontend fetch calls will handle failure gracefully and user can set override.
    return 'http://127.0.0.1:5055';
  };
  const API_BASE = resolveApiBase();
  // Expose helper to set override manually
  window.setApiBase = (url) => { localStorage.setItem('API_BASE', url); window.location.reload(); };
  window.clearApiBase = () => { localStorage.removeItem('API_BASE'); window.location.reload(); };

      // Fetch service data and defaults on component mount
      useEffect(() => {
        fetchServiceData();
        fetchDefaults();
        fetchAcademicConfig();
      }, []);

      const fetchDefaults = async () => {
        try {
          const res = await fetch(`${API_BASE}/api/defaults`);
          if (!res.ok) throw new Error('Failed to fetch defaults');
          const data = await res.json();
          setConstraints(data);
        } catch (e) {
          console.error('Failed to fetch defaults:', e);
          // Keep existing defaults if fetch fails
        }
      };

      const fetchAcademicConfig = async () => {
        try {
          const res = await fetch(`${API_BASE}/api/config/rules`);
          if (!res.ok) throw new Error('Failed to fetch config');
          const data = await res.json();
          setAcademicConfig(data);
        } catch (e) {
          console.error('Failed to fetch academic config:', e);
        }
      };

      const saveAcademicConfig = async () => {
        try {
          const res = await fetch(`${API_BASE}/api/config/rules`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(academicConfig),
          });
          if (res.ok) {
            alert('✓ Academic configuration saved!');
          }
        } catch (e) {
          alert('Failed to save configuration');
        }
      };

      const resetAcademicConfig = async () => {
        try {
          const res = await fetch(`${API_BASE}/api/config/reset`, { method: 'POST' });
          if (res.ok) {
            await fetchAcademicConfig();
            alert('✓ Configuration reset to defaults!');
          }
        } catch (e) {
          alert('Failed to reset configuration');
        }
      };

      const fetchServiceData = async (forceRefresh = false) => {
        setLoadingServices(true);
        setServiceError(null);
        try {
          const url = forceRefresh 
            ? `${API_BASE}/api/services?refresh=true` 
            : `${API_BASE}/api/services`;
          const res = await fetch(url);
          if (!res.ok) throw new Error('Failed to fetch service data');
          const data = await res.json();
          setServiceData(data);
        } catch (e) {
          console.error('Failed to fetch service data:', e);
          setServiceError(e.message);
        } finally {
          setLoadingServices(false);
        }
      };

      const runOptimization = async () => {
        setLoading(true);
        try {
          // Always send selected_components explicitly in constraints
          const constraintsPayload = { ...constraints };
          if (!constraintsPayload.selected_components) {
            constraintsPayload.selected_components = serviceData?.services?.options ? Object.keys(serviceData.services.options) : [
              "api_gateway", "identity_management", "analytics", "database", "application_server", "storage",
              "cache", "message_queue", "cdn", "load_balancer", "monitoring", "backup", "encryption", "containers", "serverless_compute"
            ];
          }
          // Build workload profile
          const usageProfile = {
            requests_per_month: Number(requestsPerMonth),
            cross_az_gb: Number(crossAzGb),
            internet_egress_gb: Number(internetEgressGb),
            ebs_gb: Number(ebsGb),
            rds_backup_gb: Number(rdsBackupGb),
            s3_gb: Number(s3Gb)
          };
          const res = await fetch(`${API_BASE}/api/optimize`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
              constraints: constraintsPayload, 
              preferences,
              csp: academicConfig?.csp || undefined,
              usage_profile: usageProfile
            }),
          });
          const data = await res.json();
          setResults(data);
          setActiveTab('results');
        } catch (e) {
          console.error('Optimization failed:', e);
          alert('Optimization failed. Ensure the backend is running.');
        } finally {
          setLoading(false);
        }
      };

      const runBaselineComparison = async () => {
        setLoadingBaselines(true);
        try {
          // Always send selected_components explicitly in constraints
          const constraintsPayload = { ...constraints };
          if (!constraintsPayload.selected_components) {
            constraintsPayload.selected_components = serviceData?.services?.options ? Object.keys(serviceData.services.options) : [
              "api_gateway", "identity_management", "analytics", "database", "application_server", "storage",
              "cache", "message_queue", "cdn", "load_balancer", "monitoring", "backup", "encryption", "containers", "serverless_compute"
            ];
          }
          // Build workload profile
          const usageProfile = {
            requests_per_month: Number(requestsPerMonth),
            cross_az_gb: Number(crossAzGb),
            internet_egress_gb: Number(internetEgressGb),
            ebs_gb: Number(ebsGb),
            rds_backup_gb: Number(rdsBackupGb),
            s3_gb: Number(s3Gb)
          };
          const res = await fetch(`${API_BASE}/api/compare-baselines`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ constraints: constraintsPayload, preferences, usage_profile: usageProfile }),
          });
          const data = await res.json();
          setBaselineComparison(data);
          setActiveTab('comparison');
        } catch (e) {
          console.error('Baseline comparison failed:', e);
          alert('Baseline comparison failed. Ensure the backend is running.');
        } finally {
          setLoadingBaselines(false);
        }
      };

      const exportResults = () => {
        if (!results) return;
        const dataStr = JSON.stringify(results, null, 2);
        const url = URL.createObjectURL(new Blob([dataStr], { type: 'application/json' }));
        const link = document.createElement('a');
        link.href = url; link.download = 'cloud-migration-results.json'; link.click();
      };

      const downloadAcademicReport = async () => {
        if (!results) {
          alert('No benchmark results available. Please run an optimization first.');
          return;
        }
        
        try {
          // Prepare complete benchmark data
          const benchmarkData = {
            v3: results.v3_data || {},
            v4: {
              solutions: results.rankedSolutions || [],
              pareto_frontier: results.paretoFrontier?.solutions || [],
              pareto_metrics: results.paretoFrontier?.metrics || {},
              deduplication_stats: results.deduplicationStats || {},
              metadata: {
                execution_time_ms: results.metrics?.total_time_ms || 0,
                timestamp: new Date().toISOString()
              }
            },
            metrics: results.metrics || {},
            constraints: constraints,
            preferences: preferences
          };

          // Call academic report endpoint
          const response = await fetch(`${API_BASE}/api/benchmark/academic-report`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
              benchmark_data: benchmarkData,
              charts_data: null  // TODO: Can add chart exports here
            }),
          });

          if (!response.ok) {
            const errorData = await response.json().catch(() => ({ error: response.statusText }));
            throw new Error(errorData.error || `Report generation failed: ${response.statusText}`);
          }

          // Download the PDF
          const blob = await response.blob();
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `Academic_Report_${new Date().toISOString().replace(/[:.]/g, '-')}.pdf`;
          document.body.appendChild(a);
          a.click();
          window.URL.revokeObjectURL(url);
          document.body.removeChild(a);
        } catch (error) {
          console.error('Academic report download error:', error);
          alert(`Failed to download academic report: ${error.message}`);
        }
      };

      return (
        <div className="min-h-screen bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900">
          <header className="bg-black/30 backdrop-blur-sm border-b border-blue-500/20">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 md:px-8 py-4">
              <div className="flex flex-wrap items-center justify-between gap-4">
                <div className="flex items-center gap-3">
                  <Cloud className="w-8 h-8 text-blue-400" />
                  <div>
                    <h1 className="text-2xl font-bold text-white">Cloud Migration Optimizer</h1>
                    <p className="text-sm text-blue-300">CSP + Expert System Hybrid Approach</p>
                  </div>
                </div>
                <div className="flex flex-wrap gap-2 overflow-x-auto pb-2">
                  <button onClick={() => setActiveTab('configuration')} className={`px-4 py-2 rounded-lg transition ${activeTab === 'configuration' ? 'bg-blue-600 text-white' : 'bg-white/10 text-blue-200 hover:bg-white/20'}`}>
                    <Settings className="w-4 h-4 inline mr-2" /> Configure
                  </button>
                  <button onClick={() => setActiveTab('academic')} className={`px-4 py-2 rounded-lg transition ${activeTab === 'academic' ? 'bg-purple-600 text-white' : 'bg-white/10 text-blue-200 hover:bg-white/20'}`}>
                    🎓 Academic
                  </button>
                  <button onClick={() => setActiveTab('results')} disabled={!results} className={`px-4 py-2 rounded-lg transition ${activeTab === 'results' && results ? 'bg-blue-600 text-white' : 'bg-white/10 text-blue-200 hover:bg-white/20 disabled:opacity-50'}`}>
                    <TrendingUp className="w-4 h-4 inline mr-2" /> Results
                  </button>
                  <button onClick={() => setActiveTab('comparison')} disabled={!baselineComparison} className={`px-4 py-2 rounded-lg transition ${activeTab === 'comparison' && baselineComparison ? 'bg-orange-600 text-white' : 'bg-white/10 text-blue-200 hover:bg-white/20 disabled:opacity-50'}`}>
                    📊 Comparison
                  </button>
                  <button onClick={() => setActiveTab('explainability')} disabled={!results || !results.explainability} className={`px-4 py-2 rounded-lg transition ${activeTab === 'explainability' && results && results.explainability ? 'bg-green-600 text-white' : 'bg-white/10 text-blue-200 hover:bg-white/20 disabled:opacity-50'}`}>
                    🔍 Explainability
                  </button>
                  <a href="academic_tests.html" className="px-4 py-2 rounded-lg transition bg-white/10 text-blue-200 hover:bg-white/20 flex items-center gap-2">
                    📈 Experiments
                  </a>
                  <div className="relative z-50">
                    <a href="docs.html" target="_blank" className="px-4 py-2 rounded-lg transition bg-white/10 text-blue-200 hover:bg-white/20 flex items-center gap-2">
                      📚 Documentation
                    </a>
                  </div>
                  <a href="figures.html" className="px-4 py-2 rounded-lg transition bg-white/10 text-blue-200 hover:bg-white/20 flex items-center gap-2">
                    📊 Figures & Tables
                  </a>
                    <a href="index_normalized.html" target="_blank" className="px-4 py-2 rounded-lg transition bg-white/10 text-green-200 hover:bg-white/20 flex items-center gap-2">
                      🧮 Normalized Scoring
                    </a>
                    <a href="cmov4.html" className="px-4 py-2 rounded-lg transition bg-gradient-to-r from-cyan-600 to-blue-600 text-white hover:from-cyan-700 hover:to-blue-700 flex items-center gap-2 font-semibold shadow-lg">
                      ⚡ CMOv4
                    </a>

                </div>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 sm:px-6 md:px-8 py-8">
            {loadingServices && (
              <div className="bg-blue-500/20 backdrop-blur-md rounded-xl p-4 mb-6 border border-blue-500/30 flex items-center gap-3">
                <div className="w-5 h-5 border-2 border-blue-400/30 border-t-blue-400 rounded-full animate-spin" />
                <span className="text-blue-200">Loading service data...</span>
              </div>
            )}

            {serviceError && (
              <div className="bg-red-500/20 backdrop-blur-md rounded-xl p-4 mb-6 border border-red-500/30">
                <div className="flex items-center justify-between">
                  <span className="text-red-200">⚠️ Error loading service data: {serviceError}</span>
                  <button onClick={() => fetchServiceData(true)} className="px-3 py-1 bg-red-600 text-white rounded hover:bg-red-700 transition text-sm">
                    Retry
                  </button>
                </div>
              </div>
            )}

            {serviceData && !loadingServices && (
              <div className="bg-green-500/10 backdrop-blur-md rounded-xl mb-6 border border-green-500/20 relative z-40">
                <div className="flex items-center justify-between p-4 cursor-pointer" onClick={() => setShowServiceBanner(!showServiceBanner)}>
                  <div className="flex items-center gap-3 flex-1">
                    <CheckCircle className="w-5 h-5 text-green-400" />
                    <div className="text-green-200">
                      <div className="font-semibold">Service data loaded successfully</div>
                      {!showServiceBanner && serviceData.cache_info.last_updated && (
                        <div className="text-xs text-green-300 mt-0.5">
                          Last updated: {new Date(serviceData.cache_info.last_updated).toLocaleTimeString()}
                        </div>
                      )}
                    </div>
                  </div>
                  <div className="flex items-center gap-2">
                    <button 
                      onClick={(e) => { e.stopPropagation(); fetchServiceData(true); }} 
                      className="px-3 py-1 bg-green-600 text-white rounded hover:bg-green-700 transition text-sm flex items-center gap-2"
                    >
                      <Download className="w-3 h-3" /> Refresh
                    </button>
                    <svg className={`w-5 h-5 text-green-400 transition-transform ${showServiceBanner ? 'rotate-180' : ''}`} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 9l-7 7-7-7" />
                    </svg>
                  </div>
                </div>
                {showServiceBanner && (
                  <div className="px-4 pb-4 pt-0">
                    {serviceData.services.pricing_sources ? (
                      <div className="text-sm space-y-1 text-green-200">
                        <div>🔸 AWS: <strong>{serviceData.services.pricing_sources.aws}</strong></div>

                                <div className="bg-blue-900/20 rounded p-2">

                                  <div className="text-gray-400">{JSON.stringify(step.input_data).slice(0, 100)}...</div>
                                </div>
                                <div className="bg-green-900/20 rounded p-2">
                                  <div className="text-green-300 font-semibold mb-1">Output</div>
                                  <div className="text-gray-400">{JSON.stringify(step.output_data).slice(0, 100)}...</div>
                                </div>
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Explainability Comparison */}
                <div className="bg-white/10 backdrop-blur-md rounded-xl p-6 border border-green-500/20">
                  <h3 className="text-xl font-semibold text-white mb-3 flex items-center gap-2">
                    📊 Explainability Comparison: CSP+Expert vs Baselines
                  </h3>
                  <p className="text-green-200 text-sm mb-4">
                    Quantitative comparison showing the transparency advantage of the hybrid approach
                  </p>
                  
                  {/* Explainability Scores Bar Chart */}
                  <div className="mb-6">
                    {Object.entries(results.explainability.comparison.methods).map(([method, data]) => (
                      <div key={method} className="mb-3">
                        <div className="flex items-center justify-between mb-1">
                          <span className="text-white font-medium">{method}</span>
                          <span className="text-green-400 font-bold">{data.explainability_score}/100</span>
                        </div>
                        <div className="w-full bg-gray-700 rounded-full h-6 overflow-hidden">
                          <div 
                            className={`h-full ${method === 'CSP+Expert' ? 'bg-green-500' : 'bg-gray-500'} flex items-center justify-end pr-2 text-xs text-white font-semibold transition-all duration-500`}
                            style={{width: `${data.explainability_score}%`}}
                          >
                            {data.transparency}
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>

                  {/* CSP+Expert Unique Features */}
                  <div className="bg-green-900/20 rounded-lg p-4 border border-green-500/30">
                    <div className="text-green-300 font-semibold mb-2">🏆 Unique Advantages of CSP+Expert System</div>
                    <ul className="space-y-2 text-sm text-green-200">
                      {results.explainability.comparison.summary.unique_features.map((feature, idx) => (
                        <li key={idx} className="flex items-start gap-2">
                          <span className="text-green-400 mt-1">✓</span>
                          <span>{feature}</span>
                        </li>
                      ))}
                    </ul>
                  </div>
                </div>

                {/* Academic Impact */}
                <div className="bg-green-900/20 backdrop-blur-md rounded-xl p-6 border border-green-500/30">
                  <h3 className="text-lg font-semibold text-green-300 mb-3 flex items-center gap-2">
                    📖 Academic & Practical Impact
                  </h3>
                  <div className="text-green-200 text-sm space-y-2">
                    <p>
                      <strong>Research Contribution:</strong> {results.explainability.comparison.summary.academic_impact}
                    </p>
                    <p>
                      <strong>Industry Value:</strong> {results.explainability.comparison.summary.practical_impact}
                    </p>
                    <p>
                      <strong>Explainability Advantage:</strong> {results.explainability.comparison.summary.advantage}
                    </p>
                  </div>
                </div>
              </div>
            )}
          </main>

          <footer className="mt-12 border-t border-blue-500/20 bg-black/30 backdrop-blur-sm">
            <div className="max-w-7xl mx-auto px-6 py-4 text-center text-blue-300 text-sm">
              Hybrid CSP + Expert System Approach | Based on Research by Olariu & Alboaie (2025)
            </div>
          </footer>
        </div>
      );
    }

    /* Academic Summary Component */
    const AcademicSummary = ({ results, academicConfig }) => {
      if (!results || !results.metrics) return null;
      const metrics = results.metrics;
      const pareto = results.paretoFrontier;
      const top = results.topSolution;
      const ruleCount = top?.evaluationLog?.length || 0;
      const totalRulesDefined = academicConfig?.rules ? Object.keys(academicConfig.rules).length : null;
      // Reconstruct score from evaluation log (base 100 + impacts)
      let reconstructedScore = 0;
      if (top?.evaluationLog) {
        reconstructedScore = 100 + top.evaluationLog.reduce((sum, r) => sum + (r.impact || 0), 0);
      }
      // Use raw_score if available (uncapped), otherwise use displayed score
      const rawScore = top?.raw_score !== undefined ? top.raw_score : top?.score;
      const displayedScore = top?.score || rawScore;
      const scoreDelta = Math.abs(rawScore - reconstructedScore);
      const scoreIntegrityPass = scoreDelta < 1e-6; // backend may store float exactly
      // Constraint proof accuracy (if explainability present)
      let constraintsSatisfiedRatio = null;
      if (results.explainability?.constraintProof) {
        const cps = results.explainability.constraintProof;
        const satisfied = cps.filter(c => c.satisfied).length;
        constraintsSatisfiedRatio = (satisfied / cps.length) * 100;
      }
      // Rule coverage estimate
      const ruleCoverage = totalRulesDefined ? ((ruleCount / totalRulesDefined) * 100).toFixed(1) : 'N/A';
      // Reliability proximity (if normalization available via pareto extreme solutions else approximate)
      const reliability = top?.reliability || 0;
      const relMax = results.statistics?.reliability?.max || reliability;
      const reliabilityAccuracy = relMax ? (reliability / relMax) * 100 : 100;
      // Overall explanation accuracy heuristic
      const components = [];
      components.push(scoreIntegrityPass ? 1 : 0);
      if (constraintsSatisfiedRatio !== null) components.push(constraintsSatisfiedRatio / 100);
      if (ruleCoverage !== 'N/A') components.push(parseFloat(ruleCoverage) / 100);
      const explanationAccuracy = (components.reduce((a,b)=>a+b,0) / components.length) * 100;
      // Accuracy labels
      const accuracyLabel = explanationAccuracy >= 90 ? 'High' : explanationAccuracy >= 75 ? 'Moderate' : 'Needs Review';
      return (
        <div className="bg-gradient-to-r from-blue-800/40 to-purple-800/40 backdrop-blur-md rounded-xl p-6 border border-purple-500/30">
          <h2 className="text-2xl font-bold text-white mb-4 flex items-center gap-2">
            <span>🎓</span>
            <span>Academic Interpretation & Explanation Accuracy</span>
          </h2>
          <div className="grid md:grid-cols-4 gap-4 mb-6">
            <div className="bg-white/5 rounded-lg p-4 border border-blue-500/30">
              <div className="text-blue-300 text-xs mb-1">Search Space Reduction</div>
              <div className="text-lg font-bold text-white">{metrics.search_space_size.toLocaleString()} → {metrics.feasible_space_size}</div>
              <div className="text-blue-300 text-xs mt-1">Pruning: {metrics.pruning_efficiency}%</div>
            </div>
            <div className="bg-white/5 rounded-lg p-4 border border-cyan-500/30">
              <div className="text-cyan-300 text-xs mb-1">Timing Breakdown</div>
              <div className="text-lg font-bold text-white">{metrics.total_time_ms}ms</div>
              <div className="text-cyan-300 text-[10px] mt-1">CSP {metrics.csp_time_ms}ms • Expert {metrics.expert_time_ms}ms • Pareto {metrics.pareto_time_ms}ms</div>
            </div>
            <div className="bg-white/5 rounded-lg p-4 border border-green-500/30">
              <div className="text-green-300 text-xs mb-1">Frontier</div>
              <div className="text-lg font-bold text-white">{metrics.pareto_frontier_size} sol.</div>
              <div className="text-green-300 text-[10px] mt-1">Coverage {pareto?.metrics.coverage_rate}% • HV {pareto?.metrics.hypervolume.toFixed(2)}</div>
            </div>
            <div className="bg-white/5 rounded-lg p-4 border border-purple-500/30">
              <div className="text-purple-300 text-xs mb-1">Explanation Accuracy</div>
              <div className="text-lg font-bold text-white">{explanationAccuracy.toFixed(1)}%</div>
              <div className="text-purple-300 text-[10px] mt-1">{accuracyLabel}</div>
            </div>
          </div>
          <div className="space-y-3 text-sm text-blue-200">
            <p>
              <strong>Score Integrity:</strong> Reconstructed score {reconstructedScore.toFixed(2)} vs raw {rawScore.toFixed(2)} → {scoreIntegrityPass ? 'PASS (exact match)' : `Δ=${scoreDelta.toFixed(4)} (check evaluation log)`}. {rawScore !== displayedScore && `Note: Displayed score ${displayedScore.toFixed(2)} is capped at 150 for normalization.`}
            </p>
            {constraintsSatisfiedRatio !== null && (
              <p>
                <strong>Constraint Satisfaction:</strong> {constraintsSatisfiedRatio.toFixed(1)}% of constraints satisfied (mathematical proof). This confirms CSP phase validity.
              </p>
            )}
            <p>
              <strong>Rule Coverage:</strong> {ruleCount} rules fired{totalRulesDefined ? ` / ${totalRulesDefined} defined` : ''} ({ruleCoverage === 'N/A' ? 'coverage unknown' : `${ruleCoverage}% coverage`}). Higher coverage indicates deeper expert system engagement.
            </p>
            <p>
              <strong>Reliability Proximity:</strong> {reliabilityAccuracy.toFixed(1)}% of observed max reliability, ensuring performance claims are near empirical upper bound.
            </p>
            <p>
              <strong>Frontier Interpretation:</strong> Size {metrics.pareto_frontier_size} reflects dominance compression; limited trade-off points suggest either tight constraints or aligned objectives. To expand: relax budget/latency or switch CSP strategy.
            </p>
            <p>
              <strong>Economic Impact:</strong> Recommended cost ${top?.cost.toFixed(2)} vs max {results.statistics?.cost?.max.toFixed(2)} (Δ ${(results.statistics && top) ? (results.statistics.cost.max - top.cost).toFixed(0) : '—'}). Latency {top?.latency.toFixed(2)}ms with no cheaper + faster alternative → Pareto optimal confirmation.
            </p>
            <p>
              <strong>Explainability Quality Metric:</strong> Accuracy combines score integrity, constraint satisfaction, and rule coverage. Values &gt;90% indicate publication-grade traceability.
            </p>
            <p>
              <strong>Replication Guidance:</strong> Persist pricing snapshot, seed_used, rule log, and configuration JSON to reproduce results across temporal pricing shifts.
            </p>
          </div>
          <div className="mt-5 grid md:grid-cols-2 gap-4 text-xs">
            <div className="bg-blue-900/30 rounded p-3 border border-blue-500/30">
              <div className="text-blue-300 font-semibold mb-1">Recommended Reporting Set</div>
              <ul className="list-disc ml-4 space-y-1 text-blue-200">
                <li>search_space_size, feasible_space_size, pruning_efficiency</li>
                <li>csp_time_ms, expert_time_ms, pareto_time_ms, total_time_ms</li>
                <li>pareto_frontier_size, hypervolume, coverage_rate</li>
                <li>rule trace + seed_used + timestamp</li>
                <li>configuration + cost/latency + providerDistribution</li>
              </ul>
            </div>
            <div className="bg-purple-900/30 rounded p-3 border border-purple-500/30">
              <div className="text-purple-300 font-semibold mb-1">Next Research Extensions</div>
              <ul className="list-disc ml-4 space-y-1 text-purple-200">
                <li>Add carbon intensity & reliability to Pareto objectives</li>
                <li>Adaptive rule weighting via feedback loops</li>
                <li>Surrogate feasibility prediction to cut CSP time</li>
                <li>Outranking methods (ELECTRE/Promethee) for robustness</li>
              </ul>
            </div>
          </div>
          <div className="mt-4 bg-black/30 rounded p-3 border border-white/10 text-[11px] text-gray-300">
            <strong>Accuracy Definition:</strong> Score integrity (exact reconstruction), constraint satisfaction ratio, and rule coverage fraction jointly form an Explanation Accuracy composite. Thresholds: ≥90% High, 75–89% Moderate, &lt;75% Review.
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<CloudMigrationOptimizer />);
  </script>
</body>
</html>
