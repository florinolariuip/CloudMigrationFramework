<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Academic Experiments — Cloud Migration Optimizer</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 text-white">
  <div id="root"></div>

  <script type="text/babel">
    // Simple error boundary component
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error('ErrorBoundary caught:', error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="bg-red-900 text-red-200 p-6 rounded-xl mt-8">
              <h2 className="text-xl font-bold mb-2">An error occurred in the experiment page.</h2>
              <pre className="text-xs whitespace-pre-wrap">{this.state.error && this.state.error.toString()}</pre>
              <div className="mt-2">Try refreshing the page or check the console for details.</div>
            </div>
          );
        }
        return this.props.children;
      }
    }
    const { useState, useEffect } = React;
  // Dynamic API base resolution with localStorage override (align with main dashboard)
  function resolveApiBase() {
    const heroku = 'https://migration-framework-c77589bc07d3.herokuapp.com';
    const explicit = window.API_BASE || localStorage.getItem('API_BASE');
    if (explicit) return explicit.replace(/\/$/, '');
    const isLocal = ['localhost','127.0.0.1'].includes(window.location.hostname);
    return isLocal ? 'http://127.0.0.1:5055' : heroku;
  }
  const API_BASE = resolveApiBase();
  window.setApiBase = (url) => { localStorage.setItem('API_BASE', url); window.location.reload(); };
  window.clearApiBase = () => { localStorage.removeItem('API_BASE'); window.location.reload(); };

    function Header() {
      return (
        <header className="bg-black/30 backdrop-blur-sm border-b border-blue-500/20 sticky top-0 z-50">
          <div className="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div>
              <h1 className="text-2xl font-bold">Academic Experiments — Scalability Tests</h1>
              <p className="text-sm text-blue-300">5 / 10 / 15 components — reproducible test harness</p>
            </div>
            <div className="flex gap-3">
              <a href="index.html" className="px-4 py-2 rounded-lg bg-white/10 text-blue-200 hover:bg-white/20">← Back</a>
              <button id="exportAll" className="px-4 py-2 rounded-lg bg-blue-600 text-white">Export All</button>
              <button id="exportCSV" className="px-4 py-2 rounded-lg bg-white/10 text-blue-200 hover:bg-white/20">Export CSV</button>
            </div>
          </div>
        </header>
      );
    }

    function pretty(value, digits=2) {
      if (value === null || value === undefined || isNaN(value)) return '—';
      return Number(value).toFixed(digits);
    }

    // Small Pareto scatter SVG (size customizable)
    function ParetoMini({ pareto, width = 360, height = 220 }) {
      if (!pareto || !pareto.solutions || pareto.solutions.length === 0) return (
        <div className="text-xs text-yellow-300">No Pareto solutions to plot.</div>
      );
      const sols = pareto.solutions;
      const costs = sols.map(s => s.cost);
      const lats = sols.map(s => s.latency);
      const minC = Math.min(...costs), maxC = Math.max(...costs);
      const minL = Math.min(...lats), maxL = Math.max(...lats);
      const rawCR = maxC - minC, rawLR = maxL - minL;
      const rangeC = rawCR > 50 ? rawCR : 50;
      const rangeL = rawLR > 2 ? rawLR : 2;
      const offC = rawCR < 50 ? (50 - rawCR) / 2 : 0;
      const offL = rawLR < 2 ? (2 - rawLR) / 2 : 0;
      const w = width, h = height, left = 40, right = 10, top = 10, bottom = 30;
      const innerW = w - left - right;
      const innerH = h - top - bottom;
      const toX = (c) => left + ((c - minC + offC) / rangeC) * innerW;
      const toY = (l) => top + innerH - ((l - minL + offL) / rangeL) * innerH;
      const extremes = pareto.extremeSolutions || {};
      return (
        <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-56">
          <rect x="0" y="0" width={w} height={h} fill="rgba(255,255,255,0.03)" />
          <line x1={left} y1={h-bottom} x2={w-right} y2={h-bottom} stroke="rgba(255,255,255,0.5)" strokeWidth="1.5" />
          <line x1={left} y1={top} x2={left} y2={h-bottom} stroke="rgba(255,255,255,0.5)" strokeWidth="1.5" />
          <text x={(w)/2} y={h-6} fill="white" textAnchor="middle" fontSize="11">Cost ($)</text>
          <text x="8" y={h/2} fill="white" textAnchor="middle" fontSize="11" transform={`rotate(-90 8 ${h/2})`}>Latency (ms)</text>
          {sols.map((s, i) => {
            const x = toX(s.cost); const y = toY(s.latency);
            const isMinC = extremes.minCost && s.cost === extremes.minCost.cost;
            const isMinL = extremes.minLatency && s.latency === extremes.minLatency.latency;
            const isBal = extremes.balanced && s.cost === extremes.balanced.cost && s.latency === extremes.balanced.latency;
            let color = 'rgba(96,165,250,0.9)', r = 6;
            if (isMinC) { color = 'rgba(34,197,94,1)'; r=8; }
            if (isMinL) { color = 'rgba(59,130,246,1)'; r=8; }
            if (isBal)  { color = 'rgba(168,85,247,1)'; r=8; }
            return (
              <g key={i}>
                <circle cx={x} cy={y} r={r} fill={color} stroke="white" strokeWidth="1.5" />
                <text x={x + r + 3} y={y + 4} fontSize="10" fill="white">#{i+1}</text>
              </g>
            );
          })}
        </svg>
      );
    }

    // Small Sankey using Plotly; expects sankeyDiagram.costFlow
    function SankeyMini({ sankey, id }) {
      const divId = `sankey_${id}`;
      useEffect(() => {
        if (!sankey || !sankey.costFlow || !window.Plotly) return;
        const data = sankey.costFlow;
        const nodes = data.nodes || [];
        const links = data.links || [];
        const plotData = [{
          type: 'sankey',
          orientation: 'h',
          node: {
            label: nodes.map(n => n.name),
            color: nodes.map(n => n.color || 'rgba(200,200,200,0.9)'),
            pad: 10,
            thickness: 12
          },
          link: {
            source: links.map(l => l.source),
            target: links.map(l => l.target),
            value: links.map(l => l.value),
            color: links.map(l => l.color || 'rgba(0,0,0,0.2)')
          }
        }];
        const layout = { margin: {l:10, r:10, t:10, b:10}, paper_bgcolor: 'rgba(0,0,0,0)', font: {color: 'white'} };
        const config = { displayModeBar: false };
        Plotly.newPlot(divId, plotData, layout, config);
      }, [sankey, id]);
      if (!sankey || !sankey.costFlow) return <div className="text-xs text-yellow-300">No Sankey data.</div>;
      return <div id={divId} className="w-full h-56"></div>;
    }

    function ExperimentPage() {
    const [serviceData, setServiceData] = useState(null);
    const [results, setResults] = useState([]);
    const [running, setRunning] = useState(false);
    const [repeatCount, setRepeatCount] = useState(3);
    const [maxBudget, setMaxBudget] = useState(5000);
    const [maxLatency, setMaxLatency] = useState(12);
    const [maxProviders, setMaxProviders] = useState(2);
    const [prioritizeCost, setPrioritizeCost] = useState(false);
    const [prioritizePerformance, setPrioritizePerformance] = useState(false);
    const [cspConfig, setCspConfig] = useState({ search_strategy: 'heuristic', sample_size: 100 });
    const [chartModal, setChartModal] = useState(null); // { size, runIndex, run }
    const sizes = cspConfig.search_strategy === 'exhaustive' ? [5] : [5, 10, 15];

      useEffect(() => {
        // Load services catalog
        fetch(`${API_BASE}/api/services`).then(r => r.json()).then(setServiceData).catch(e => {
          console.error('services fetch failed', e);
          setServiceData(null);
        });
        // Load current CSP config to mirror strategy settings from main app
        fetch(`${API_BASE}/api/config/rules`).then(r => r.json()).then((cfg)=>{
          if (cfg && cfg.csp) setCspConfig({
            search_strategy: cfg.csp.search_strategy || 'heuristic',
            sample_size: cfg.csp.sample_size || 100,
          });
        }).catch(()=>{});
      }, []);

      useEffect(() => {
        // Export JSON and CSV for all results with current settings
        const btn = document.getElementById('exportAll');
        const btnCsv = document.getElementById('exportCSV');
        if (!btn && !btnCsv) return;

        const jsonHandler = () => {
          const payload = {
            generatedAt: new Date().toISOString(),
            settings: {
              sizes,
              repeatCount,
              constraints: { maxBudget, maxLatency, maxProviders },
              csp: { search_strategy: cspConfig.search_strategy, sample_size: cspConfig.sample_size },
              preferences: { prioritizeCost, prioritizePerformance },
            },
            results,
          };
          const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = 'academic-experiments.json'; a.click();
          URL.revokeObjectURL(url);
        };

        const csvHandler = () => {
          const header = [
            'Components','SelectedComponents','Budget','MaxLatencyMs','MaxProviders','Strategy','SampleSize','PrefCost','PrefPerf','MeanTimeMean','MeanTimeStd','ParetoMean','ParetoStd','FeasibleMean','HypervolumeMean','SpacingMean','CoverageMean','Runs'
          ];
          const lines = [header.join(',')];
          (results || []).forEach(r => {
            const s = r.summary || {};
            const comps = (r.selected_components || []).join('; ');
            const row = [
              r.size,
              `"${comps}"`,
              maxBudget ?? '',
              maxLatency ?? '',
              maxProviders ?? '',
              cspConfig.search_strategy,
              cspConfig.sample_size,
              prioritizeCost ? 1 : 0,
              prioritizePerformance ? 1 : 0,
              s.time_ms?.mean ?? '', s.time_ms?.std ?? '',
              s.pareto_frontier_size?.mean ?? '', s.pareto_frontier_size?.std ?? '',
              s.feasible_space_size?.mean ?? '',
              s.hypervolume?.mean ?? '',
              s.spacing?.mean ?? '',
              s.coverage_rate?.mean ?? '',
              s.time_ms?.n ?? (r.runs?.length || '')
            ];
            lines.push(row.join(','));
          });
          const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = 'academic-experiments-summary.csv'; a.click();
          URL.revokeObjectURL(url);
        };

        if (btn) btn.addEventListener('click', jsonHandler);
        if (btnCsv) btnCsv.addEventListener('click', csvHandler);
        return () => {
          if (btn) btn.removeEventListener('click', jsonHandler);
          if (btnCsv) btnCsv.removeEventListener('click', csvHandler);
        };
      }, [results, maxBudget, maxLatency, maxProviders, repeatCount]);

      async function runForSize(N) {
        // Choose N components deterministically
        const available = serviceData?.services?.options ? Object.keys(serviceData.services.options) : [
          'api_gateway','identity_management','analytics','database','application_server','storage','cache','message_queue','cdn','load_balancer','monitoring','backup','encryption','containers','serverless_compute'
        ];
        const selected = available.slice(0, N);

        const runResults = [];
        for (let r = 0; r < repeatCount; r++) {
          const constraints = { maxBudget, maxLatency, maxProviders, selected_components: selected };
          const t0 = performance.now();
          let data = null;
          let t1 = null;
          try {
            const res = await fetch(`${API_BASE}/api/optimize`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ constraints, preferences: { prioritizeCost, prioritizePerformance } })
            });
            t1 = performance.now();
            const contentType = res.headers.get('content-type') || '';
            if (!res.ok) {
              const text = await res.text();
              throw new Error(`HTTP ${res.status} for N=${N} run=${r+1}: ${text.slice(0,200)}`);
            }
            if (!/application\/json/.test(contentType)) {
              const text = await res.text();
              throw new Error(`Non-JSON response for N=${N} run=${r+1}: ${text.slice(0,200)}`);
            }
            try {
              data = await res.json();
            } catch (parseErr) {
              const text = await res.text();
              throw new Error(`JSON parse error for N=${N} run=${r+1}: ${parseErr.message}; snippet: ${text.slice(0,120)}`);
            }
          } catch (err) {
            console.error('Run failed (will record error entry):', err);
            runResults.push({
              time_ms: performance.now() - t0,
              error: err.message,
              pareto_frontier_size: 0,
              feasible_space_size: null,
              hypervolume: null,
              spacing: null,
              coverage_rate: null,
              raw: { error: err.message }
            });
            continue; // proceed to next repeat
          }


          // Normalize metrics based on backend schema
          const m = data.metrics || {};
          const pf = data.paretoFrontier || {};
          const pfm = pf.metrics || {};

          const entry = {
            time_ms: (t1 - t0),
            search_space_size: m.search_space_size ?? null,
            feasible_space_size: m.feasible_space_size ?? null, // backward compat (post-dedup)
            feasible_pre_dedup: m.feasible_pre_dedup ?? null,
            feasible_post_dedup: m.feasible_post_dedup ?? m.feasible_space_size ?? null,
            duplicates_removed: m.duplicates_removed ?? null,
            pareto_frontier_size: (pf.size ?? m.pareto_frontier_size ?? 0),
            hypervolume: (pfm.hypervolume ?? null),
            spacing: (pfm.spacing ?? null),
            coverage_rate: (pfm.coverage_rate ?? null),
            csp_time_ms: m.csp_time_ms ?? null,
            expert_time_ms: m.expert_time_ms ?? null,
            pareto_time_ms: m.pareto_time_ms ?? null,
            explainability_time_ms: m.explainability_time_ms ?? null,
            raw: data,
          };
          runResults.push(entry);
        }

        // Compute mean/std utility
        const meanStd = (arr, key) => {
          const vals = arr.map(x => x[key]).filter(v => typeof v === 'number' && !isNaN(v));
          if (vals.length === 0) return null;
          const mean = vals.reduce((a,b)=>a+b,0) / vals.length;
          const std = Math.sqrt(vals.reduce((a,b)=>a+(b-mean)*(b-mean),0) / vals.length);
          return { mean, std, n: vals.length };
        };

        const summary = {
          time_ms: meanStd(runResults, 'time_ms'),
          pareto_frontier_size: meanStd(runResults, 'pareto_frontier_size'),
          feasible_space_size: meanStd(runResults, 'feasible_space_size'), // legacy
          feasible_post_dedup: meanStd(runResults, 'feasible_post_dedup'),
          feasible_pre_dedup: meanStd(runResults, 'feasible_pre_dedup'),
          duplicates_removed: meanStd(runResults, 'duplicates_removed'),
          hypervolume: meanStd(runResults, 'hypervolume'),
          spacing: meanStd(runResults, 'spacing'),
          coverage_rate: meanStd(runResults, 'coverage_rate'),
          csp_time_ms: meanStd(runResults, 'csp_time_ms'),
          pareto_time_ms: meanStd(runResults, 'pareto_time_ms'),
        };
        return { size: N, runs: runResults, summary, selected_components: selected };
      }

      async function runAll() {
        setRunning(true);
        setResults([]);
        const out = [];
        // Ensure backend uses selected CSP settings before runs
        try {
          await fetch(`${API_BASE}/api/config/rules`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ csp: { search_strategy: cspConfig.search_strategy, sample_size: cspConfig.sample_size } })
          });
        } catch (e) { console.warn('Failed to set CSP config', e); }
        for (const N of sizes) {
          try {
            const r = await runForSize(N);
            out.push(r);
            setResults(prev => [...prev, r]);
          } catch (e) {
            console.error('Run failed for N=', N, e);
            setResults(prev => [...prev, { size: N, error: e.toString() }]);
          }
        }
        setRunning(false);
      }

      return (
        <main className="max-w-7xl mx-auto px-6 py-8">
          <div className="bg-white/10 rounded-xl p-6 border border-blue-500/20 mb-6">
            <h2 className="text-xl font-semibold">Experiment: {sizes.join(' / ')} Components</h2>
            {cspConfig.search_strategy === 'exhaustive' && (
              <div className="text-xs text-yellow-300 mb-2">Exhaustive search is only available for N=5 due to the extremely high number of combinations for larger N. Use Heuristic or Random Sampling for N=10 or N=15.</div>
            )}
            <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-4 text-sm text-blue-200 mt-1">
              <label className="flex items-center gap-2">Repeats per size:
                <input type="number" min="1" value={repeatCount}
                  onChange={(e)=>setRepeatCount(parseInt(e.target.value||'1'))}
                  className="ml-2 w-24 text-black rounded px-2 py-1" />
              </label>
              <label className="flex items-center gap-2">Budget ($):
                <input type="number" min="1" value={maxBudget}
                  onChange={(e)=>setMaxBudget(parseFloat(e.target.value||'0'))}
                  className="ml-2 w-28 text-black rounded px-2 py-1" />
              </label>
              <label className="flex items-center gap-2">Max Latency (ms):
                <input type="number" min="1" step="0.1" value={maxLatency}
                  onChange={(e)=>setMaxLatency(parseFloat(e.target.value||'0'))}
                  className="ml-2 w-28 text-black rounded px-2 py-1" />
              </label>
              <label className="flex items-center gap-2">Max Providers:
                <input type="number" min="1" value={maxProviders}
                  onChange={(e)=>setMaxProviders(parseInt(e.target.value||'1'))}
                  className="ml-2 w-24 text-black rounded px-2 py-1" />
              </label>
              <label className="flex items-center gap-2">Strategy:
                <select value={cspConfig.search_strategy} onChange={(e)=>setCspConfig({...cspConfig, search_strategy: e.target.value})} className="ml-2 w-40 text-black rounded px-2 py-1">
                  <option value="exhaustive">Exhaustive</option>
                  <option value="heuristic">Heuristic</option>
                  <option value="random_sample">Random Sampling</option>
                </select>
              </label>
              <label className="flex items-center gap-2">Sample Size:
                <input type="number" min="1" value={cspConfig.sample_size} onChange={(e)=>setCspConfig({...cspConfig, sample_size: parseInt(e.target.value||'0')})} className="ml-2 w-28 text-black rounded px-2 py-1" />
              </label>
              <div className="flex items-center gap-6">
                <label className="flex items-center gap-2">
                  <input type="checkbox" checked={prioritizeCost} onChange={(e)=>setPrioritizeCost(e.target.checked)} className="w-4 h-4" />
                  <span>Prioritize Cost</span>
                </label>
                <label className="flex items-center gap-2">
                  <input type="checkbox" checked={prioritizePerformance} onChange={(e)=>setPrioritizePerformance(e.target.checked)} className="w-4 h-4" />
                  <span>Prioritize Performance</span>
                </label>
              </div>
            </div>
            <div className="mt-2 text-xs text-blue-200">
              Constraints used for all runs: Budget <span className="font-semibold">${'{'}maxBudget{'}'}</span>, Max Latency <span className="font-semibold">{maxLatency}ms</span>, Max Providers <span className="font-semibold">{maxProviders}</span>. Strategy: <span className="font-semibold capitalize">{cspConfig.search_strategy.replace('_',' ')}</span>{cspConfig.search_strategy === 'random_sample' ? (<><span> (n=</span><span className="font-semibold">{cspConfig.sample_size}</span><span>)</span></>) : null}. Preferences: <span className="font-semibold">{prioritizeCost ? 'Cost' : '—'}</span> / <span className="font-semibold">{prioritizePerformance ? 'Performance' : '—'}</span>.
            </div>
            <div className="mt-4 flex gap-3">
              <button onClick={runAll} disabled={running || !serviceData} className="px-4 py-2 bg-blue-600 rounded disabled:opacity-50">{running ? 'Running…' : 'Run All'}</button>
              <button onClick={()=>setResults([])} className="px-4 py-2 bg-white/10 rounded">Clear</button>
            </div>
            <div className="text-xs text-yellow-300 mt-3">Note: ensure backend is running (API {API_BASE}). Uses first N components from catalog. Override API via <code>setApiBase('https://…')</code> in console if needed.</div>
          </div>

          <div className="bg-white/10 rounded-xl p-6 border border-cyan-500/20 mb-6">
            <h3 className="text-lg font-semibold mb-3">Summary Table</h3>
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead>
                  <tr className="text-left text-blue-200">
                    <th className="py-2 px-3">Components</th>
                    <th className="py-2 px-3">Selected Components</th>
                    <th className="py-2 px-3">Mean Time (ms)</th>
                    <th className="py-2 px-3">Pareto (μ±σ)</th>
                    <th className="py-2 px-3">Feasible Post (μ)</th>
                    <th className="py-2 px-3">Feasible Pre (μ)</th>
                    <th className="py-2 px-3">Dup Removed (μ)</th>
                    <th className="py-2 px-3">Hypervolume (μ)</th>
                    <th className="py-2 px-3">Spacing (μ)</th>
                    <th className="py-2 px-3">Coverage % (μ)</th>
                    <th className="py-2 px-3">Details</th>
                  </tr>
                </thead>
                <tbody>
                  {results.length === 0 && (
                    <tr><td colSpan="9" className="py-4 text-blue-300">No runs yet. Click “Run All”.</td></tr>
                  )}
                  {results.map((r, idx) => (
                    <tr key={idx} className="border-t border-white/5">
                      <td className="py-2 px-3">{r.size}</td>
                      <td className="py-2 px-3">
                        <div className="max-w-xs truncate" title={(r.selected_components||[]).join(', ')}>
                          {(r.selected_components||[]).join(', ')}
                        </div>
                      </td>
                      <td className="py-2 px-3">{r.summary?.time_ms ? `${pretty(r.summary.time_ms.mean,1)} ± ${pretty(r.summary.time_ms.std,1)}` : '—'}</td>
                      <td className="py-2 px-3">{r.summary?.pareto_frontier_size ? `${pretty(r.summary.pareto_frontier_size.mean,1)} ± ${pretty(r.summary.pareto_frontier_size.std,1)}` : '—'}</td>
                      <td className="py-2 px-3">{r.summary?.feasible_post_dedup ? `${Math.round(r.summary.feasible_post_dedup.mean)}` : (r.summary?.feasible_space_size ? `${Math.round(r.summary.feasible_space_size.mean)}` : '—')}</td>
                      <td className="py-2 px-3">{r.summary?.feasible_pre_dedup ? `${Math.round(r.summary.feasible_pre_dedup.mean)}` : '—'}</td>
                      <td className="py-2 px-3">{r.summary?.duplicates_removed ? `${Math.round(r.summary.duplicates_removed.mean)}` : '—'}</td>
                      <td className="py-2 px-3">{r.summary?.hypervolume ? `${pretty(r.summary.hypervolume.mean,2)}` : '—'}</td>
                      <td className="py-2 px-3">{r.summary?.spacing ? `${pretty(r.summary.spacing.mean,2)}` : '—'}</td>
                      <td className="py-2 px-3">{r.summary?.coverage_rate ? `${pretty(r.summary.coverage_rate.mean,1)}%` : '—'}</td>
                      <td className="py-2 px-3"><button onClick={()=>alert(JSON.stringify(r, null, 2))} className="px-2 py-1 bg-white/10 rounded">View</button></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div className="text-xs text-blue-300 mt-3">Placeholders: add per-size Pareto charts and Sankey captures below for the paper.</div>
          </div>

          <div className="space-y-6">
            {results.map((r, i) => (
              <div key={i} className="bg-white/5 rounded-xl p-6 border border-blue-500/20">
                <div className="flex items-center justify-between mb-3">
                  <h4 className="font-semibold">N = {r.size}</h4>
                  <div className="text-xs text-blue-300">Runs: {r.runs?.length || 0}</div>
                </div>
                <div className="text-xs text-blue-200 mb-3">Selected components: {r.selected_components?.join(', ')}</div>
                {r.error && <div className="text-red-400">Error: {r.error}</div>}
                {r.runs && (
                  <div className="grid md:grid-cols-3 gap-4">
                    <div className="bg-white/10 rounded p-3">
                      <div className="text-xs text-blue-300">Mean runtime (ms)</div>
                      <div className="text-xl font-bold">{r.summary.time_ms ? `${pretty(r.summary.time_ms.mean,1)}` : '—'}</div>
                    </div>
                    <div className="bg-white/10 rounded p-3">
                      <div className="text-xs text-blue-300">Pareto mean</div>
                      <div className="text-xl font-bold">{r.summary.pareto_frontier_size ? `${pretty(r.summary.pareto_frontier_size.mean,1)}` : '—'}</div>
                    </div>
                    <div className="bg-white/10 rounded p-3">
                      <div className="text-xs text-blue-300">Feasible mean</div>
                      <div className="text-xl font-bold">{r.summary.feasible_space_size ? `${Math.round(r.summary.feasible_space_size.mean)}` : '—'}</div>
                    </div>
                  </div>
                )}
                <div className="mt-4 grid md:grid-cols-2 gap-4">
                  <div className="bg-white/10 rounded p-3">
                    <div className="text-xs text-blue-300 mb-1">Pareto plot (first run)</div>
                    {r.runs && r.runs[0] && r.runs[0].raw && r.runs[0].raw.paretoFrontier ? (
                      <ParetoMini pareto={r.runs[0].raw.paretoFrontier} />
                    ) : (
                      <div className="text-xs text-yellow-300">No Pareto data.</div>
                    )}
                  </div>
                  <div className="bg-white/10 rounded p-3">
                    <div className="text-xs text-blue-300 mb-1">Sankey (cost flow, first run)</div>
                    {r.runs && r.runs[0] && r.runs[0].raw && r.runs[0].raw.sankeyDiagram ? (
                      <SankeyMini sankey={r.runs[0].raw.sankeyDiagram} id={`n${r.size}`} />
                    ) : (
                      <div className="text-xs text-yellow-300">No Sankey data.</div>
                    )}
                  </div>
                </div>

                <div className="mt-4">
                  <div className="text-xs text-blue-300 mb-2">Per-run data (copy raw JSON for appendix):</div>
                  <div className="space-y-2">
                    {r.runs && r.runs.map((run, j) => (
                      <div key={j} className="flex items-center justify-between bg-white/10 p-2 rounded">
                        <div className="text-xs">Run #{j+1} — time: {pretty(run.time_ms,1)}ms — pareto: {run.pareto_frontier_size} — feasible: {run.feasible_space_size ?? '—'}</div>
                        <div className="flex gap-2">
                          <button onClick={()=>{ navigator.clipboard.writeText(JSON.stringify(run.raw, null, 2)); }} className="px-2 py-1 bg-white/10 rounded text-xs">Copy JSON</button>
                          <a href="#" onClick={(e)=>{ e.preventDefault(); setChartModal({ size: r.size, runIndex: j, run }); }} className="px-2 py-1 bg-blue-600 rounded text-xs">Chart</a>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
                <div className="mt-4">
                  <h5 className="text-sm font-semibold mb-2">Paper-ready table (first run extremes)</h5>
                  {r.runs && r.runs[0] && r.runs[0].raw && r.runs[0].raw.paretoFrontier && r.runs[0].raw.paretoFrontier.extremeSolutions ? (
                    <div className="overflow-x-auto">
                      <table className="w-full text-xs">
                        <thead>
                          <tr className="text-left text-blue-200">
                            <th className="py-2 px-3">Extreme</th>
                            <th className="py-2 px-3">Cost ($)</th>
                            <th className="py-2 px-3">Latency (ms)</th>
                            <th className="py-2 px-3">Providers</th>
                          </tr>
                        </thead>
                        <tbody>
                          {['minCost','minLatency','balanced'].map(key => {
                            const s = r.runs[0].raw.paretoFrontier.extremeSolutions[key];
                            if (!s) return null;
                            const label = key === 'minCost' ? 'Min Cost' : key === 'minLatency' ? 'Min Latency' : 'Balanced';
                            return (
                              <tr key={key} className="border-t border-white/5">
                                <td className="py-2 px-3">{label}</td>
                                <td className="py-2 px-3">{pretty(s.cost,2)}</td>
                                <td className="py-2 px-3">{pretty(s.latency,2)}</td>
                                <td className="py-2 px-3">{s.providers ?? '—'}</td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  ) : (
                    <div className="text-xs text-blue-300">Extremes not available.</div>
                  )}
                </div>
              </div>
            ))}
          </div>

          <footer className="mt-12 border-t border-blue-500/20 py-6 text-center text-blue-300">
            Hybrid CSP + Expert System Approach | Based on Research by Olariu & Alboaie (2025)
          </footer>
          {/* Chart modal */}
          <ChartModal open={!!chartModal} onClose={()=>setChartModal(null)} payload={chartModal} />
        </main>
      );
    }

    // Modal to display detailed charts for a specific run
  function ChartModal({ open, onClose, payload }) {
      React.useEffect(() => {
        function onKey(e){ if (e.key === 'Escape') onClose(); }
        if (open) window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [open, onClose]);
      if (!open || !payload) return null;
  const { size, runIndex, run } = payload;
  const divId = `modal_sankey_${size}_${runIndex}`;
  const fullDivId = `sankey_${divId}`; // matches SankeyMini internal id
  const paretoRef = React.useRef(null);
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center">
          <div className="absolute inset-0 bg-black/60" onClick={onClose}></div>
          <div className="relative bg-slate-900 w-[90vw] max-w-5xl max-h-[90vh] overflow-auto rounded-xl border border-blue-500/30 p-5">
            <div className="flex items-center justify-between mb-3">
              <h3 className="text-lg font-semibold">Charts — N = {size}, Run #{runIndex+1}</h3>
              <button onClick={onClose} className="px-3 py-1 bg-white/10 rounded">Close</button>
            </div>
            <div className="grid md:grid-cols-2 gap-4">
              <div className="bg-white/5 rounded p-3" ref={paretoRef}>
                <div className="flex items-center justify-between mb-2">
                  <div className="text-xs text-blue-300">Pareto (Cost vs Latency)</div>
                  {run?.raw?.paretoFrontier && (
                    <button onClick={()=>{
                      const container = paretoRef.current;
                      if (!container) return;
                      const svg = container.querySelector('svg');
                      if (!svg) return;
                      const ser = new XMLSerializer();
                      const src = ser.serializeToString(svg);
                      const blob = new Blob([src], {type: 'image/svg+xml;charset=utf-8'});
                      const url = URL.createObjectURL(blob);
                      const a = document.createElement('a');
                      a.href = url; a.download = `pareto_N${size}_run${runIndex+1}.svg`; a.click();
                      URL.revokeObjectURL(url);
                    }} className="px-2 py-1 bg-blue-600 rounded text-xs">Download SVG</button>
                  )}
                </div>
                {run?.raw?.paretoFrontier ? (
                  <ParetoMini pareto={run.raw.paretoFrontier} width={640} height={380} />
                ) : (
                  <div className="text-xs text-yellow-300">No Pareto data for this run.</div>
                )}
              </div>
              <div className="bg-white/5 rounded p-3">
                <div className="flex items-center justify-between mb-2">
                  <div className="text-xs text-blue-300">Sankey (Cost Flow)</div>
                  {run?.raw?.sankeyDiagram?.costFlow && (
                    <button onClick={()=>{
                      if (window.Plotly) {
                        window.Plotly.downloadImage(document.getElementById(fullDivId), {format: 'png', width: 900, height: 500, filename: `sankey_N${size}_run${runIndex+1}`});
                      }
                    }} className="px-2 py-1 bg-blue-600 rounded text-xs">Download PNG</button>
                  )}
                </div>
                {run?.raw?.sankeyDiagram ? (
                  <SankeyMini sankey={run.raw.sankeyDiagram} id={divId} />
                ) : (
                  <div className="text-xs text-yellow-300">No Sankey data for this run.</div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      return (
        <div>
          <Header />
          <ExperimentPage />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
