<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloud Migration Optimizer v4</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900">
  <nav class="bg-slate-900/80 backdrop-blur-md shadow-lg px-6 py-4 flex items-center justify-between border-b border-blue-500/30">
    <div class="flex items-center gap-2">
      <span class="font-bold text-xl bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">Cloud Migration Optimizer v4</span>
    </div>
    <div class="flex gap-4">
      <a href="index.html" class="text-blue-400 hover:text-cyan-400 transition">CMOv3</a>
      <a href="docs.html" class="text-blue-400 hover:text-cyan-400 transition">Docs</a>
    </div>
  </nav>
  <div id="root" class="max-w-6xl mx-auto mt-8 px-4"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const scenarios = [
      { name: "5 Components", key: 0, description: "Monolith, React, Python, Postgres, Redis, Prometheus" },
      { name: "10 Components", key: 1, description: "Microservices, Angular, Java, MySQL, Memcached, Grafana, RabbitMQ, S3, Nginx, Vault" },
      { name: "15 Components", key: 2, description: "Event-driven, Vue, Go, SQL Server, Redis, Datadog, Kafka, Blob, HAProxy, Restic, Keycloak, Cloudflare, Mixpanel, AWS KMS, Docker, Lambda" }
    ];

    // Dynamic API base URL - works locally and on Heroku
    const API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
      ? 'http://localhost:5055'
      : '';

    function App() {
      const [mode, setMode] = useState('preset');
      const [selected, setSelected] = useState(0);
      const [loading, setLoading] = useState(false);
      const [results, setResults] = useState(null);
      const [rawV4, setRawV4] = useState(null);
      const [showRaw, setShowRaw] = useState(false);
      
      // Baseline comparison
      const [baselineComparison, setBaselineComparison] = useState(null);
      const [loadingBaselines, setLoadingBaselines] = useState(false);

      // Workload profile
      const [requestsPerMonth, setRequestsPerMonth] = useState('1000000');
      const [crossAzGb, setCrossAzGb] = useState('100');
      const [internetEgressGb, setInternetEgressGb] = useState('500');
      const [ebsGb, setEbsGb] = useState('1000');
      const [rdsBackupGb, setRdsBackupGb] = useState('200');
      const [s3Gb, setS3Gb] = useState('5000');

      // Preferences
      const [preferredProvider, setPreferredProvider] = useState('');
      const [prioritizeCost, setPrioritizeCost] = useState(false);
      const [prioritizePerformance, setPrioritizePerformance] = useState(false);

      // Custom scenario constraints
      const [maxBudget, setMaxBudget] = useState('10000');
      const [maxLatency, setMaxLatency] = useState('150');

      // Custom scenario
      const [customArchPattern, setCustomArchPattern] = useState('microservices');
      const [customComponents, setCustomComponents] = useState([]);
      const [customProviders, setCustomProviders] = useState(['AWS', 'Azure', 'GCP']);
      const [searchStrategy, setSearchStrategy] = useState('heuristic');
      const [sampleSize, setSampleSize] = useState('1000');

      const architecturePatterns = [
        { id: 'monolith', name: 'Monolith', recommended: ['web','compute','database','cache','monitoring'] },
        { id: 'microservices', name: 'Microservices', recommended: ['web','compute','database','cache','monitoring','message_queue','load_balancer','storage'] },
        { id: 'event-driven', name: 'Event-Driven', recommended: ['web','compute','database','cache','monitoring','message_queue','serverless_compute','storage','analytics'] }
      ];

      const componentTypes = [
        { type: 'web', label: 'Web Frontend' },
        { type: 'compute', label: 'Application Server' },
        { type: 'database', label: 'Database' },
        { type: 'cache', label: 'Cache' },
        { type: 'monitoring', label: 'Monitoring' },
        { type: 'message_queue', label: 'Message Queue' },
        { type: 'storage', label: 'Object Storage' },
        { type: 'load_balancer', label: 'Load Balancer' },
        { type: 'backup', label: 'Backup' },
        { type: 'security', label: 'Security / Secrets' },
        { type: 'cdn', label: 'CDN' },
        { type: 'analytics', label: 'Analytics' },
        { type: 'encryption', label: 'Encryption / KMS' },
        { type: 'containers', label: 'Containers' },
        { type: 'serverless_compute', label: 'Serverless' },
      ];

      const searchStrategies = [
        { id: 'random_sample', name: 'Random Sampling', description: 'Fast, explores diverse solutions' },
        { id: 'exhaustive', name: 'Exhaustive Search', description: 'Thorough, checks all combinations' },
        { id: 'heuristic', name: 'Smart Heuristic', description: '~50 intelligent strategies (cost, perf, hybrid, random)' }
      ];

      const applyRecommendedComponents = () => {
        const p = architecturePatterns.find(x => x.id === customArchPattern);
        if (p) setCustomComponents(p.recommended);
      };

      // Auto-apply recommended components when architecture pattern changes
      useEffect(() => {
        applyRecommendedComponents();
      }, [customArchPattern]);

      function normalizeV4(v4) {
        if (!v4) return null;
        const paretoSolutions = v4.pareto_frontier || [];
        const metrics = v4.metrics || {};
        const extremes = v4.extreme_solutions || {};
        return {
          metrics: {
            feasible_space_size: metrics.feasible_count || 0,
            pareto_frontier_size: metrics.pareto_count || paretoSolutions.length || 0,
          },
          paretoFrontier: {
            size: metrics.pareto_count || paretoSolutions.length || 0,
            solutions: paretoSolutions,
            metrics: {
              hypervolume: metrics.hypervolume || 0,
              coverage_rate: metrics.coverage_rate || 0,
              cost_range: metrics.cost_range || {},
              latency_range: metrics.latency_range || {},
            },
            extremeSolutions: {
              minCost: extremes.min_cost || null,
              minLatency: extremes.min_latency || null,
              balanced: extremes.balanced || null,
            }
          },
          solutions: v4.solutions || [],
          topSolution: v4.solutions && v4.solutions.length ? v4.solutions[0] : null,
          explanations: v4.explanations || [],
          sankeyDiagram: null,
        };
      }

      async function enrichWithSankey(normalized) {
        try {
          if (!normalized?.topSolution?.configuration) return normalized;
          const sol = normalized.topSolution;
          const payloadBase = {
            configuration: sol.configuration,
            cost: sol.cost,
            latency: sol.latency,
            providers: sol.providers,
            providerDistribution: sol.providerDistribution || undefined,
          };
          const [costRes, latRes] = await Promise.all([
            fetch(`${API_BASE}/api/sankey`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ ...payloadBase, type: 'cost' }) }),
            fetch(`${API_BASE}/api/sankey`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ ...payloadBase, type: 'latency' }) }),
          ]);
          const costFlow = costRes.ok ? await costRes.json() : null;
          const latencyFlow = latRes.ok ? await latRes.json() : null;
          return { ...normalized, sankeyDiagram: { costFlow, latencyFlow } };
        } catch (e) {
          console.warn('Sankey enrichment failed:', e);
          return normalized;
        }
      }

      const handleRun = async () => {
        setLoading(true); setResults(null); setRawV4(null);
        try {
          const qs = new URLSearchParams({
            scenario: String(selected),
            requests_per_month: String(requestsPerMonth),
            cross_az_gb: String(crossAzGb),
            internet_egress_gb: String(internetEgressGb),
            ebs_gb: String(ebsGb),
            rds_backup_gb: String(rdsBackupGb),
            s3_gb: String(s3Gb),
            preferred_provider: preferredProvider || '',
            prioritize_cost: prioritizeCost ? '1' : '0',
            prioritize_performance: prioritizePerformance ? '1' : '0',
          }).toString();
          const res = await fetch(`${API_BASE}/api/benchmark?${qs}`);
          const data = await res.json();
          const v4 = data?.v4;
          setRawV4(v4);
          let normalized = normalizeV4(v4);
          normalized = await enrichWithSankey(normalized);
          setResults(normalized);
        } catch (e) {
          setResults({ error: 'Failed to run benchmark.' });
        } finally {
          setLoading(false);
        }
      };

      const handleCustomRun = async () => {
        setLoading(true); setResults(null); setRawV4(null);
        try {
          const techStackMap = {
            'web': { framework: 'React' },
            'compute': { language: 'Python' },
            'database': { engine: 'Postgres' },
            'cache': { engine: 'Redis' },
            'monitoring': { tool: 'Prometheus' },
            'message_queue': { engine: 'RabbitMQ' },
            'storage': { engine: 'S3' },
            'load_balancer': { engine: 'Nginx' },
            'backup': { tool: 'Velero' },
            'security': { tool: 'Vault' },
            'cdn': { engine: 'Cloudflare' },
            'analytics': { tool: 'Mixpanel' },
            'encryption': { tool: 'AWS KMS' },
            'containers': { engine: 'Docker' },
            'serverless_compute': { engine: 'AWS Lambda' }
          };
          const components = customComponents.map((type, idx) => ({
            name: `Component${idx+1}`,
            type,
            instance_count: 1,
            tech_stack: techStackMap[type] || {},
            dependencies: []
          }));
          const scenario = {
            architecture: {
              architecture_pattern: customArchPattern,
              components,
              relationships: [],
              multi_tenancy: customArchPattern !== 'monolith',
              selection_rules: [],
            },
            constraints: {
              maxBudget: Number(maxBudget),
              maxLatency: Number(maxLatency),
              requiredProviders: customProviders,
              usage_profile: {
                requests_per_month: Number(requestsPerMonth),
                cross_az_gb: Number(crossAzGb),
                internet_egress_gb: Number(internetEgressGb),
                ebs_gb: Number(ebsGb),
                rds_backup_gb: Number(rdsBackupGb),
                s3_gb: Number(s3Gb)
              }
            },
            preferences: {
              preferredProvider: preferredProvider || null,
              prioritizeCost: prioritizeCost,
              prioritizePerformance: prioritizePerformance
            },
            config: { search_strategy: searchStrategy, sample_size: Number(sampleSize) }
          };
          const res = await fetch(`${API_BASE}/api/benchmark/dynamic`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ scenario })
          });
          const data = await res.json();
          const v4 = data?.v4;
          setRawV4(v4);
          let normalized = normalizeV4(v4);
          normalized = await enrichWithSankey(normalized);
          setResults(normalized);
        } catch (e) {
          setResults({ error: 'Failed to run custom benchmark.' });
        } finally {
          setLoading(false);
        }
      };

      const downloadPDFReport = async (results) => {
        try {
          // Prepare scenario info - ensure all numeric values are numbers
          const scenarioInfo = {
            scenario_name: mode === 'preset' ? `Preset Scenario ${selected}` : 'Custom Scenario',
            architecture_pattern: customArchPattern || 'microservices',
            components_count: mode === 'custom' ? customComponents.length : 5,
            max_budget: Number(maxBudget) || 2000,
            max_latency: Number(maxLatency) || 20,
            requests_per_month: Number(requestsPerMonth) || 1000000,
            cross_az_gb: Number(crossAzGb) || 100,
            internet_egress_gb: Number(internetEgressGb) || 500,
            ebs_gb: Number(ebsGb) || 200,
            rds_backup_gb: Number(rdsBackupGb) || 50,
            s3_gb: Number(s3Gb) || 1000,
            preferred_provider: preferredProvider || 'None',
            prioritize_cost: Boolean(prioritizeCost),
            prioritize_performance: Boolean(prioritizePerformance),
            search_strategy: searchStrategy || 'adaptive',
            sample_size: Number(sampleSize) || 100,
          };

          // Prepare solution data - ensure numeric fields are numbers
          const solution = {
            ...results.topSolution,
            cost: Number(results.topSolution.cost) || 0,
            latency: Number(results.topSolution.latency) || 0,
            providers: Number(results.topSolution.providers) || 1,
            score: Number(results.topSolution.score) || 0,
            pareto_rank: 1,
            pareto_frontier_info: results.paretoFrontier,
            explanations: results.explanations || [],
          };

          // Call PDF generation endpoint
          const response = await fetch(`${API_BASE}/api/cmov4/generate-pdf`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ solution, scenario_info: scenarioInfo }),
          });

          if (!response.ok) {
            const errorData = await response.json().catch(() => ({ error: response.statusText }));
            throw new Error(errorData.error || `PDF generation failed: ${response.statusText}`);
          }

          // Download the PDF
          const blob = await response.blob();
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `CMOv4_Report_${new Date().toISOString().replace(/[:.]/g, '-')}.pdf`;
          document.body.appendChild(a);
          a.click();
          window.URL.revokeObjectURL(url);
          document.body.removeChild(a);
        } catch (error) {
          console.error('PDF download error:', error);
          alert(`Failed to download PDF report: ${error.message}`);
        }
      };

      const runBaselineComparison = async () => {
        if (!results || !results.topSolution) {
          alert('Please run optimization first to generate results.');
          return;
        }
        
        setLoadingBaselines(true);
        try {
          // Extract actual components from the benchmark results
          const actualComponents = results.topSolution.configuration 
            ? Object.keys(results.topSolution.configuration) 
            : (mode === 'custom' ? customComponents : ['web', 'compute', 'database', 'cache', 'monitoring']);
          
          console.log('Benchmark results:', results);
          console.log('Extracted components:', actualComponents);
          console.log('Max budget:', maxBudget, 'Max latency:', maxLatency);
          console.log('Pareto frontier from benchmark:', results.paretoFrontier);
          console.log('Pareto solutions array:', results.paretoFrontier?.solutions);
          
          // Prepare scenario parameters using actual benchmark constraints
          const scenario = {
            components: actualComponents,
            maxBudget: Number(maxBudget) || 10000,
            maxLatency: Number(maxLatency) || 150,
            maxProviders: 3,
            // Send the existing Pareto frontier solutions array from the benchmark
            paretoFrontier: results.paretoFrontier?.solutions || []
          };
          
          console.log('Sending scenario to backend:', scenario);

          const res = await fetch(`${API_BASE}/api/cmov4/compare-baselines`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ scenario })
          });

          if (!res.ok) {
            throw new Error(`HTTP ${res.status}: ${res.statusText}`);
          }

          const data = await res.json();
          setBaselineComparison(data);
          console.log('Baseline comparison results:', data);
        } catch (e) {
          console.error('Baseline comparison failed:', e);
          alert(`Baseline comparison failed: ${e.message}`);
        } finally {
          setLoadingBaselines(false);
        }
      };

      return (
        <div className="p-4 min-h-screen">
          <div className="mb-6 flex items-center gap-4">
            <button 
              onClick={() => setMode('preset')} 
              className={`px-6 py-3 rounded-xl font-semibold transition ${mode==='preset' ? 'bg-gradient-to-r from-blue-600 to-cyan-600 text-white shadow-lg' : 'bg-white/10 backdrop-blur-md border border-blue-500/30 text-blue-300 hover:bg-white/20'}`}>
              Preset Scenarios
            </button>
            <button 
              onClick={() => setMode('custom')} 
              className={`px-6 py-3 rounded-xl font-semibold transition ${mode==='custom' ? 'bg-gradient-to-r from-purple-600 to-pink-600 text-white shadow-lg' : 'bg-white/10 backdrop-blur-md border border-purple-500/30 text-purple-300 hover:bg-white/20'}`}>
              Custom Scenario
            </button>
          </div>

          {/* Validation Cards */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            {/* Unit Tests Card */}
            <div className="bg-gradient-to-br from-emerald-500/20 to-green-500/20 backdrop-blur-md rounded-xl p-6 border border-emerald-500/30 shadow-xl">
              <div className="flex items-start justify-between mb-4">
                <div>
                  <h3 className="text-xl font-bold text-emerald-300 flex items-center gap-2">
                    <span className="text-2xl">✅</span>
                    Unit Test Coverage
                  </h3>
                  <p className="text-emerald-200/80 text-sm mt-1">Comprehensive validation suite</p>
                </div>
                <div className="bg-emerald-500/30 rounded-lg px-3 py-1 text-emerald-200 font-bold text-sm">
                  14/14 PASSED
                </div>
              </div>
              
              <div className="space-y-2 mb-4">
                <div className="flex items-center justify-between text-sm">
                  <span className="text-emerald-100">CSP Constraint Satisfaction</span>
                  <span className="text-emerald-300 font-semibold">3/3 ✓</span>
                </div>
                <div className="flex items-center justify-between text-sm">
                  <span className="text-emerald-100">Solution Deduplication</span>
                  <span className="text-emerald-300 font-semibold">2/2 ✓</span>
                </div>
                <div className="flex items-center justify-between text-sm">
                  <span className="text-emerald-100">Pareto Frontier Optimization</span>
                  <span className="text-emerald-300 font-semibold">3/3 ✓</span>
                </div>
                <div className="flex items-center justify-between text-sm">
                  <span className="text-emerald-100">Budget-Relative Thresholds</span>
                  <span className="text-emerald-300 font-semibold">1/1 ✓</span>
                </div>
                <div className="flex items-center justify-between text-sm">
                  <span className="text-emerald-100">CMOv4 Instance Scaling</span>
                  <span className="text-emerald-300 font-semibold">3/3 ✓</span>
                </div>
                <div className="flex items-center justify-between text-sm">
                  <span className="text-emerald-100">Expert System Rules</span>
                  <span className="text-emerald-300 font-semibold">2/2 ✓</span>
                </div>
              </div>
              
              <div className="pt-3 border-t border-emerald-500/30">
                <p className="text-xs text-emerald-200/70">
                  All core algorithms validated: constraint satisfaction, deduplication (50% reduction), 
                  Pareto non-dominance, budget-adaptive thresholds, and instance count scaling.
                </p>
              </div>
            </div>

            {/* Sensitivity Analysis Card */}
            <div className="bg-gradient-to-br from-blue-500/20 to-indigo-500/20 backdrop-blur-md rounded-xl p-6 border border-blue-500/30 shadow-xl">
              <div className="flex items-start justify-between mb-4">
                <div>
                  <h3 className="text-xl font-bold text-blue-300 flex items-center gap-2">
                    <span className="text-2xl">📊</span>
                    Sensitivity Analysis
                  </h3>
                  <p className="text-blue-200/80 text-sm mt-1">Parameter impact validation</p>
                </div>
                <div className="bg-blue-500/30 rounded-lg px-3 py-1 text-blue-200 font-bold text-sm">
                  16 Experiments
                </div>
              </div>
              
              <div className="space-y-2 mb-4">
                <div className="flex items-center justify-between text-sm">
                  <span className="text-blue-100">Budget Sensitivity (5 levels)</span>
                  <span className="text-blue-300 font-semibold">~4 sols avg</span>
                </div>
                <div className="flex items-center justify-between text-sm">
                  <span className="text-blue-100">Latency Constraints (5 levels)</span>
                  <span className="text-blue-300 font-semibold">~3 sols avg</span>
                </div>
                <div className="flex items-center justify-between text-sm">
                  <span className="text-blue-100">Provider Diversity (1-3)</span>
                  <span className="text-blue-300 font-semibold">1 to 34 sols</span>
                </div>
                <div className="flex items-center justify-between text-sm">
                  <span className="text-blue-100">Component Count (6-15)</span>
                  <span className="text-blue-300 font-semibold">~6 sols avg</span>
                </div>
              </div>
              
              <div className="pt-3 border-t border-blue-500/30">
                <p className="text-xs text-blue-200/70">
                  <strong>Key Finding:</strong> Provider diversity has the largest impact (34× more solutions with 3 providers). 
                  Tight latency constraints (&lt;8ms) eliminate feasibility. Performance: 5-460ms avg.
                </p>
              </div>
            </div>
          </div>

          {mode === 'preset' ? (
            <div className="space-y-4">
              <div className="bg-gradient-to-r from-indigo-500/20 to-violet-500/20 backdrop-blur-md rounded-xl p-6 border border-indigo-500/30">
                <label className="block text-sm font-semibold text-blue-200 mb-2">Scenario</label>
                <select value={selected} onChange={e => setSelected(parseInt(e.target.value))} className="w-full bg-white/10 backdrop-blur-md border border-blue-500/30 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-cyan-400">
                  {scenarios.map(s => <option key={s.key} value={s.key} className="bg-slate-800">{s.name}</option>)}
                </select>
                <div className="text-xs text-blue-300 mt-2">{scenarios[selected]?.description}</div>
              </div>

              <div className="bg-gradient-to-r from-purple-500/20 to-pink-500/20 backdrop-blur-md rounded-xl p-6 border border-purple-500/30">
                <h3 className="font-semibold text-purple-200 mb-3">Workload Profile</h3>
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs text-blue-300 mb-1">Requests / Month</label>
                    <input type="number" value={requestsPerMonth} onChange={e=>setRequestsPerMonth(e.target.value)} className="w-full bg-white/10 backdrop-blur-md border border-blue-500/30 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-cyan-400" />
                  </div>
                  <div>
                    <label className="block text-xs text-blue-300 mb-1">Cross-AZ (GB)</label>
                    <input type="number" value={crossAzGb} onChange={e=>setCrossAzGb(e.target.value)} className="w-full bg-white/10 backdrop-blur-md border border-blue-500/30 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-cyan-400" />
                  </div>
                  <div>
                    <label className="block text-xs text-blue-300 mb-1">Internet Egress (GB)</label>
                    <input type="number" value={internetEgressGb} onChange={e=>setInternetEgressGb(e.target.value)} className="w-full bg-white/10 backdrop-blur-md border border-blue-500/30 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-cyan-400" />
                  </div>
                  <div>
                    <label className="block text-xs text-blue-300 mb-1">EBS (GB)</label>
                    <input type="number" value={ebsGb} onChange={e=>setEbsGb(e.target.value)} className="w-full bg-white/10 backdrop-blur-md border border-blue-500/30 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-cyan-400" />
                  </div>
                  <div>
                    <label className="block text-xs text-blue-300 mb-1">RDS Backup (GB)</label>
                    <input type="number" value={rdsBackupGb} onChange={e=>setRdsBackupGb(e.target.value)} className="w-full bg-white/10 backdrop-blur-md border border-blue-500/30 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-cyan-400" />
                  </div>
                  <div>
                    <label className="block text-xs text-blue-300 mb-1">S3 (GB)</label>
                    <input type="number" value={s3Gb} onChange={e=>setS3Gb(e.target.value)} className="w-full bg-white/10 backdrop-blur-md border border-blue-500/30 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-cyan-400" />
                  </div>
                </div>
              </div>

              <div className="bg-gradient-to-r from-cyan-500/20 to-blue-500/20 backdrop-blur-md rounded-xl p-6 border border-cyan-500/30">
                <h3 className="font-semibold text-cyan-200 mb-3">Optimization Preferences</h3>
                <div className="space-y-3">

                              if (baseline.success && baseline.cost > 0) {
                                baselineTraces.push({
                                  x: [baseline.cost],
                                  y: [baseline.latency],
                                  mode: 'markers',
                                  name: names[key] || key,
                                  marker: {size: 14, color: colors[key] || '#gray', symbol: 'circle'},
                                  text: [`${names[key]}<br>Cost: $${baseline.cost.toFixed(2)}<br>Latency: ${baseline.latency.toFixed(2)}ms`],
                                  hoverinfo: 'text'
                                });
                              }
                            });
                            
                            Plotly.newPlot('baseline-comparison-chart', [paretoData, ...baselineTraces], {
                              title: {text: 'Cost vs Latency: Pareto Frontier Dominates Single-Objective Approaches', font: {size: 16, color: 'rgba(255,255,255,0.9)'}},
                              xaxis: {title: 'Cost ($)', color: 'rgba(255,255,255,0.7)', gridcolor: 'rgba(255,255,255,0.1)'},
                              yaxis: {title: 'Latency (ms)', color: 'rgba(255,255,255,0.7)', gridcolor: 'rgba(255,255,255,0.1)'},
                              paper_bgcolor: 'rgba(0,0,0,0)',
                              plot_bgcolor: 'rgba(0,0,0,0)',
                              font: {color: 'rgba(255,255,255,0.7)'},
                              legend: {bgcolor: 'rgba(0,0,0,0.5)', font: {color: 'rgba(255,255,255,0.9)'}},
                              margin: {l: 60, r: 30, t: 50, b: 50}
                            }, {displaylogo: false, responsive: true});
                          }, 200)}
                        </div>
                      )}
                    </div>
                  )}
                </>
              )}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
