<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Cloud Migration Optimizer Icon -->
  <!-- Gradient background -->
  <defs>
    <linearGradient id="cloudGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="arrowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34D399;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#cloudGradient)" opacity="0.9"/>
  
  <!-- Cloud shape -->
  <path d="M 20 28 Q 18 24 22 22 Q 24 18 28 20 Q 32 16 36 20 Q 40 18 42 22 Q 46 24 44 28 Q 46 32 42 34 Q 40 38 36 36 Q 32 40 28 36 Q 24 38 22 34 Q 18 32 20 28 Z" 
        fill="white" opacity="0.95"/>
  
  <!-- Optimization arrow (upward trend) -->
  <path d="M 32 44 L 32 26 M 32 26 L 28 30 M 32 26 L 36 30" 
        stroke="url(#arrowGradient)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Small optimization dot -->
  <circle cx="32" cy="24" r="2.5" fill="url(#arrowGradient)"/>
</svg>
