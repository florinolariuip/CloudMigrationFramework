<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloud Migration Optimizer</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    function CloudMigrationOptimizer() {
      const [formData, setFormData] = useState({
        currentServer: '',
        targetServer: '',
        applicationType: '',
        databaseType: '',
        migrationTools: [],
        estimatedCost: '',
        confidenceLevel: '',
        notes: '',
      });

      const [migrationOptions, setMigrationOptions] = useState([]);
      const [showAdvanced, setShowAdvanced] = useState(false);

      useEffect(() => {
        // Fetch initial data for migration options
        fetch('/api/migration-options')
          .then(response => response.json())
          .then(data => setMigrationOptions(data))
          .catch(error => console.error('Error fetching migration options:', error));
      }, []);

      const handleChange = (e) => {
        const { name, value } = e.target;
        setFormData(prevState => ({
          ...prevState,
          [name]: value,
        }));
      };

      const handleToolsChange = (e) => {
        const { value, checked } = e.target;
        setFormData(prevState => {
          const tools = checked
            ? [...prevState.migrationTools, value]
            : prevState.migrationTools.filter(tool => tool !== value);
          return { ...prevState, migrationTools: tools };
        });
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        // Submit form data to the server
        fetch('/api/submit-migration', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(formData),
        })
          .then(response => response.json())
          .then(data => {
            console.log('Success:', data);
            // Optionally, reset form or show success message
          })
          .catch(error => console.error('Error submitting form:', error));
      };

      return (
        <div className="container mx-auto p-4">
          <h1 className="text-2xl font-bold mb-4">Cloud Migration Optimizer</h1>
          <form onSubmit={handleSubmit} className="space-y-4">
            <div>
              <label className="block text-sm font-medium text-gray-700">
                Current Server
              </label>
              <input
                type="text"
                name="currentServer"
                value={formData.currentServer}
                onChange={handleChange}
                required
                className="mt-1 block w-full p-2 border border-gray-300 rounded-md"
              />
            </div>
            <div>
              <label className="block text-sm font-medium text-gray-700">
                Target Server
              </label>
              <input
                type="text"
                name="targetServer"
                value={formData.targetServer}
                onChange={handleChange}
                required
                className="mt-1 block w-full p-2 border border-gray-300 rounded-md"
              />
            </div>
            <div>
              <label className="block text-sm font-medium text-gray-700">
                Application Type
              </label>
              <input
                type="text"
                name="applicationType"
                value={formData.applicationType}
                onChange={handleChange}
                className="mt-1 block w-full p-2 border border-gray-300 rounded-md"
              />
            </div>
            <div>
              <label className="block text-sm font-medium text-gray-700">
                Database Type
              </label>
              <input
                type="text"
                name="databaseType"
                value={formData.databaseType}
                onChange={handleChange}
                className="mt-1 block w-full p-2 border border-gray-300 rounded-md"
              />
            </div>
            <div>
              <label className="block text-sm font-medium text-gray-700">
                Migration Tools
              </label>
              <div className="mt-1">
                <label className="inline-flex items-center">
                  <input
                    type="checkbox"
                    value="tool1"
                    checked={formData.migrationTools.includes('tool1')}
                    onChange={handleToolsChange}
                    className="form-checkbox h-5 w-5 text-indigo-600"
                  />
                  <span className="ml-2 text-gray-700">Tool 1</span>
                </label>
                <label className="inline-flex items-center">
                  <input
                    type="checkbox"
                    value="tool2"
                    checked={formData.migrationTools.includes('tool2')}
                    onChange={handleToolsChange}
                    className="form-checkbox h-5 w-5 text-indigo-600"
                  />
                  <span className="ml-2 text-gray-700">Tool 2</span>
                </label>
                {/* Add more tools as needed */}
              </div>
            </div>
            <div>
              <label className="block text-sm font-medium text-gray-700">
                Estimated Cost
              </label>
              <input
                type="text"
                name="estimatedCost"
                value={formData.estimatedCost}
                onChange={handleChange}
                className="mt-1 block w-full p-2 border border-gray-300 rounded-md"
              />
            </div>
            <div>
              <label className="block text-sm font-medium text-gray-700">
                Confidence Level
              </label>
              <input
                type="text"
                name="confidenceLevel"
                value={formData.confidenceLevel}
                onChange={handleChange}
                className="mt-1 block w-full p-2 border border-gray-300 rounded-md"
              />
            </div>
            <div>
              <label className="block text-sm font-medium text-gray-700">
                Notes
              </label>
              <textarea
                name="notes"
                value={formData.notes}
                onChange={handleChange}
                className="mt-1 block w-full p-2 border border-gray-300 rounded-md"
              ></textarea>
            </div>
            <div>
              <button
                type="submit"
                className="w-full bg-indigo-600 text-white font-semibold py-2 px-4 rounded-md shadow-sm hover:bg-indigo-700"
              >
                Optimize Migration
              </button>
            </div>
          </form>
          <div className="mt-8">
            <button
              onClick={() => setShowAdvanced(!showAdvanced)}
              className="w-full bg-gray-200 text-gray-700 font-semibold py-2 px-4 rounded-md shadow-sm hover:bg-gray-300"
            >
              {showAdvanced ? 'Hide' : 'Show'} Advanced Options
            </button>
            {showAdvanced && (
              <div className="mt-4 p-4 border border-gray-300 rounded-md">
                <h2 className="text-lg font-bold mb-2">Advanced Migration Options</h2>
                {/* Advanced options content */}
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<CloudMigrationOptimizer />);
  </script>
</body>
</html>
